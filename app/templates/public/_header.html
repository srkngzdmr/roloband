<header class="site-header">
  <div class="container">
    <a href="{{ url_for('public.index') }}" class="brand">
      <img src="{{ url_for('static', filename='img/roloband-logo.png') }}"
           alt="ROLOBAND"
           class="brand-logo"
           width="160"
           height="48">
    </a>

    <nav class="main-nav" id="mainNav">
      {% for item in main_menu %}
        <a href="{{ item.url }}"{% if item.open_in_new_tab %} target="_blank" rel="noopener"{% endif %}>{{ tdb(item.label) }}</a>
      {% endfor %}
      <a href="{{ url_for('public.contact') }}" class="nav-cta">{{ t('nav_cta') }}</a>
    </nav>

    <div class="lang-switcher">
      <a href="/set-lang/tr" class="lang-btn{% if current_lang == 'tr' %} active{% endif %}" title="Türkçe">
        <img src="https://flagcdn.com/w20/tr.png" alt="TR">
        <span>TR</span>
      </a>
      <a href="/set-lang/en" class="lang-btn{% if current_lang == 'en' %} active{% endif %}" title="English">
        <img src="https://flagcdn.com/w20/gb.png" alt="EN">
        <span>EN</span>
      </a>
    </div>

    <button class="menu-toggle" aria-label="{{ t('nav_menu_label') }}">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
