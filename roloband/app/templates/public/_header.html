<header class="site-header">
  <div class="container">
    <a href="{{ url_for('public.index') }}" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8h18M3 12h18M3 16h18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="7" cy="8" r="1.2" fill="currentColor"/>
          <circle cx="17" cy="16" r="1.2" fill="currentColor"/>
        </svg>
      </span>
      <span>ROLO<span style="color: var(--rb-primary-dark);">BAND</span></span>
    </a>

    <nav class="main-nav" id="mainNav">
      {% for item in main_menu %}
        <a href="{{ item.url }}"{% if item.open_in_new_tab %} target="_blank" rel="noopener"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <a href="{{ url_for('public.contact') }}" class="nav-cta">Teklif Al</a>
    </nav>

    <button class="menu-toggle" aria-label="Menü">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
