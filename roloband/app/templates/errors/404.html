{% extends "public/base.html" %}

{% block title %}Sayfa Bulunamadı - {{ site_name }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">Sayfa Bulunamadı</h1>
    <p class="error-message">Aradığınız sayfa kaldırılmış, yeniden adlandırılmış veya geçici olarak kullanılamıyor olabilir.</p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('public.index') }}" class="btn btn-primary">Anasayfa</a>
      <a href="{{ url_for('public.products_index') }}" class="btn btn-outline">Ürünler</a>
    </div>
  </div>
</section>
{% endblock %}
